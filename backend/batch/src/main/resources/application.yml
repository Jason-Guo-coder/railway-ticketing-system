spring:
  application:
    name: batch

  main:
    banner-mode: off

  # Batch模块数据库连接配置
  datasource:
    url: 'jdbc:mysql://124.223.55.166:3306/railway_ticketing_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8'
    username: oceana_dev
    password: '${DB_PASSWORD}'
    driver-class-name: com.mysql.cj.jdbc.Driver

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: RailwayBatchScheduler
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: true
          threadPool:
            threadCount: 5

server:
  port: 8003
  servlet:
    context-path: /batch

mybatis-plus:
  global-config:
    banner: false

jwt:
  secret: '${JWT_SECRET}'

# Batch直接调用Business管理接口，避免定时任务绕行网关
business:
  base-url: '${BUSINESS_BASE_URL:http://127.0.0.1:8002/business}'

batch:
  jobs:
    initialize: true

logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{LOG_ID}] %-5level %logger{36} - %msg%n'
  level:
    root: WARN
    com.gjq.train.batch: INFO
