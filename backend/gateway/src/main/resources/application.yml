spring:
  # 网关服务名称
  application:
    name: gateway

  main:
    banner-mode: off

  cloud:
    gateway:
      # 路由转发，将 /member/** 请求转发到 member 模块
      routes:
        - id: member
          uri: http://127.0.0.1:8001
          predicates:
            - Path=/member/**

# 网关服务端口
server:
  port: 8000

jwt:
  secret: '${JWT_SECRET}'

# 控制台日志格式，LOG_ID 用于关联同一次请求的日志
logging:
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{LOG_ID}] %-5level %logger{36} - %msg%n'
  level:
    root: WARN
    com.gjq.train: INFO
    reactor.netty.http.server.AccessLog: INFO
